<script>
  (() => {
    const timestamp = Date.now().toString();

    document.querySelectorAll('img.cache-bust').forEach((image) => {
      const url = new URL(image.src);
      url.searchParams.set('v', timestamp);
      image.src = url.href;

      const popup = image.closest('a.popup');
      if (popup) {
        popup.href = url.href;
        // GLightbox infers type from the URL extension; chart URLs like .php would open in a blocked iframe.
        popup.dataset.type = 'image';
      }
    });
  })();
</script>
